name: Review checks

on:
  pull_request:
  push:
    branches: ['codex/review-integration-sep30-api']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run build
      - name: Contract tests
        run: find dist -type f -name '*.test.js' -print0 | xargs -0 -r node --test
